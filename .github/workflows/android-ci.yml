name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Generate ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Firestore rules tests, Android unit tests, and assemble debug APK
        run: |
          firebase emulators:exec \
            --project demo-no-project \
            --only auth,firestore \
            "npm run test:firestore && gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-iz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
