name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate ephemeral release keystore for CI validation
        run: |
          keytool -genkeypair -v \\
            -keystore ci-release.keystore \\
            -storepass ci-only-store-password \\
            -alias upload \\
            -keypass ci-only-key-password \\
            -keyalg RSA \\
            -keysize 2048 \\
            -validity 2 \\
            -dname "CN=CI Validation Only,O=AI i.z,C=GB"

      - name: Run Android unit tests and validate debug and minified release builds
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-key-password
        run: |
          gradle --no-daemon --stacktrace \\
            testDebugUnitTest assembleDebug \\
            testReleaseUnitTest assembleRelease bundleRelease

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-iz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  backend-security:
    name: Backend session and API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_iz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_iz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_iz_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: Check backend server syntax
        run: node --check backend/src/server.js
      - name: Run backend session, validation, and PostgreSQL API integration tests
        run: npm test --prefix backend
      - name: Install Runner dependencies
        run: npm install --prefix runner --no-audit --no-fund
      - name: Check Runner syntax and security tests
        run: node --check runner/src/server.js && npm test --prefix runner
