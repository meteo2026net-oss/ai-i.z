name: Android signed release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Test and build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.AI_IZ_API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD API_BASE_URL GOOGLE_WEB_CLIENT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub secret/variable: $name"
              exit 1
            fi
          done
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::AI_IZ_API_BASE_URL must use HTTPS."
            exit 1
          fi
          if [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID does not look like a Google Web OAuth client ID."
            exit 1
          fi

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ai-iz-upload.jks"
          chmod 600 "$RUNNER_TEMP/ai-iz-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ai-iz-upload.jks" >> "$GITHUB_ENV"

      - name: Run release unit tests and build signed APK/AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ai-iz-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AI_IZ_API_BASE_URL: ${{ vars.AI_IZ_API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease bundleRelease

      - name: Upload signed release outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-iz-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
